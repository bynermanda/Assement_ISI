# Render Blueprint. Every secret has "sync: false": Render asks for the value in its dashboard, it is never in GitHub.
services:
  - type: web
    name: indosafety-penilaian
    runtime: docker
    plan: free
    region: singapore          # closest Render region to the Supabase database (Tokyo)
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Penilaian Kinerja Karyawan
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY            # copy APP_KEY from your local .env (or: php artisan key:generate --show)
        sync: false
      - key: APP_URL            # e.g. https://indosafety-penilaian.onrender.com
        sync: false
      - key: APP_LOCALE
        value: id
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: TRUSTED_PROXIES    # Render's load balancer terminates HTTPS
        value: "*"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST            # Supabase pooler host
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_EMULATE_PREPARES
        value: "true"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: SESSION_SECURE_COOKIE   # login cookie only over HTTPS
        value: "true"
      - key: FORCE_PASSWORD_CHANGE   # "true" = new / reset accounts must choose their own password at first login (set "false" only during trials)
        value: "false"
      - key: DEFAULT_ACCOUNT_PASSWORD
        sync: false
      # Assessment attachments: private Supabase Storage bucket via its S3 protocol
      # (Supabase > Project Settings > Storage > S3 Connection: endpoint, region, "New access key")
      - key: SUPABASE_S3_ENDPOINT    # https://<project-ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: SUPABASE_S3_REGION
        value: ap-southeast-1
      - key: SUPABASE_S3_BUCKET
        value: lampiran-penilaian
      - key: SUPABASE_S3_KEY
        sync: false
      - key: SUPABASE_S3_SECRET
        sync: false
