# Only the Laravel public/ folder is served; .htaccess there does the front-controller rewrite.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# never serve dotfiles
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
