; app overrides on top of php.ini-production
memory_limit = 256M
max_execution_time = 90
upload_max_filesize = 20M
post_max_size = 25M
expose_php = Off
; PHP2Shell hardening: upload-progress tracking runs before the app (Laravel does not use PHP's native sessions)
session.upload_progress.enabled = Off
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
